<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting…</title>
    <script>
      const path = window.location.pathname.replace(/^\/pirate-names/, '');
      const redirect = '/pirate-names/?redirect=' + encodeURIComponent(path + window.location.search + window.location.hash);
      window.location.replace(redirect);
    </script>
  </head>
  <body></body>
</html>
